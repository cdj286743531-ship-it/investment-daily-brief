<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投资日报 | {{date}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header .date {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section h2 .emoji {
            font-size: 1.3em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        
        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .positive {
            color: #28a745;
            font-weight: 600;
        }
        
        .negative {
            color: #dc3545;
            font-weight: 600;
        }
        
        .item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        
        .item h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .item p {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 5px;
        }
        
        .item .source {
            font-size: 0.85em;
            color: #999;
            font-style: italic;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #e9ecef;
        }
        
        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        .warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        
        .success {
            background: #d4edda;
            border-left-color: #28a745;
        }
        
        .info {
            background: #d1ecf1;
            border-left-color: #17a2b8;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .content {
                padding: 20px;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 投资日报</h1>
            <div class="date">{{date}}</div>
        </div>
        
        <div class="content">
            <!-- 市场概览 -->
            <div class="section">
                <h2><span class="emoji">📈</span> 市场概览</h2>
                <table>
                    <thead>
                        <tr>
                            <th>指数</th>
                            <th>收盘</th>
                            <th>涨跌</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{market_overview}}
                    </tbody>
                </table>
            </div>
            
            <!-- 热点板块 -->
            <div class="section">
                <h2><span class="emoji">🔥</span> 热点板块</h2>
                {{hot_sectors}}
            </div>
            
            <!-- 宏观动态 -->
            <div class="section">
                <h2><span class="emoji">💵</span> 宏观动态</h2>
                {{macro_news}}
            </div>
            
            <!-- 公司动态 -->
            <div class="section">
                <h2><span class="emoji">🏢</span> 公司动态</h2>
                {{company_news}}
            </div>
            
            <!-- 机构观点 -->
            <div class="section">
                <h2><span class="emoji">📊</span> 机构观点</h2>
                {{analyst_views}}
            </div>
            
            <!-- 风险提示 -->
            <div class="section warning">
                <h2><span class="emoji">⚠️</span> 风险提示</h2>
                {{risk_alerts}}
            </div>
            
            <!-- 未来一周事件 -->
            <div class="section info">
                <h2><span class="emoji">📅</span> 未来一周事件</h2>
                {{upcoming_events}}
            </div>
        </div>
        
        <div class="footer">
            <p>数据来源：财联社、新浪财经、Reuters、Bloomberg | 截至 {{timestamp}}</p>
            <p style="margin-top: 10px; font-size: 0.85em; color: #999;">
                投资有风险，入市需谨慎。本报告仅供参考，不构成投资建议。
            </p>
        </div>
    </div>
</body>
</html>
